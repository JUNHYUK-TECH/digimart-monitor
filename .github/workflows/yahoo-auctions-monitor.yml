name: Yahoo Auctions Monitor

on:
  push:
    paths:
      - 'yahoo_monitor.py'
      - '.github/workflows/yahoo-auctions-monitor.yml'
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

concurrency:
  group: yahoo-auctions-monitor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.55.0
          playwright install --with-deps chromium
      - name: Check Yahoo Auctions
        id: scan
        run: python yahoo_monitor.py
      - name: Create issues for new listings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          d=json.load(open("data/yahoo_latest.json",encoding="utf-8"))
          items=d.get("new") or []
          if d.get("baseline") or not items:
              print("No new Yahoo Auctions listings.")
              raise SystemExit

          MAX_BODY=50000
          prefix="새 Yahoo!オークション 매물이 발견되었습니다.\n\n"
          chunks=[]; current=[]; current_len=len(prefix)
          for x in items:
              price=f'¥{x["price"]:,}'
              buyout=f' / 즉결 ¥{x["buyout"]:,}' if x.get("buyout") else ""
              end=f'\n- 종료: {x["end"]}' if x.get("end") else ""
              block=(
                  f'### [{x["keyword"]}] {x["title"]}\n'
                  f'- 현재가: {price}{buyout}{end}\n'
                  f'- 링크: {x["url"]}\n\n'
              )
              if current and current_len+len(block)>MAX_BODY:
                  chunks.append(current); current=[]; current_len=len(prefix)
              current.append(block); current_len+=len(block)
          if current: chunks.append(current)

          total=len(chunks)
          for i,chunk in enumerate(chunks,1):
              suffix=f" ({i}/{total})" if total>1 else ""
              subprocess.run([
                  "gh","issue","create",
                  "--title",f"Yahoo Auctions 신규 매물 {len(chunk)}건{suffix}",
                  "--body",prefix+"".join(chunk)
              ],check=True)
          PY
      - name: Save Yahoo state
        if: ${{ !cancelled() && (success() || steps.scan.outcome == 'failure') }}
        run: |
          git config user.name "yahoo-auctions-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/yahoo_seen.json data/yahoo_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Yahoo Auctions monitor state"
            git fetch origin main
            git rebase origin/main
            git push
          else
            echo "No Yahoo state changes to save."
          fi
