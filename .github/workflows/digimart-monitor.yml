name: Digimart Free Monitor

on:
  push:
    paths:
      - 'monitor.py'
      - '.github/workflows/digimart-monitor.yml'
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: digimart-monitor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.55.0
          playwright install --with-deps chromium
      - name: Check Digimart
        id: scan
        run: python monitor.py
      - name: Create issue for new listings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          d=json.load(open("data/latest.json",encoding="utf-8"))
          items=d.get("new") or []
          if d.get("baseline") or not items:
              print("No new qualifying products.")
              raise SystemExit

          # GitHub Issue bodies are limited to 65,536 characters.
          # Keep each alert comfortably below that limit.
          MAX_BODY=50000
          prefix="새 Digimart 매물이 발견되었습니다.\n\n"
          chunks=[]
          current=[]
          current_len=len(prefix)

          for x in items:
              block=(
                  f'### [{x["keyword"]}] {x["title"]}\n'
                  f'- 가격: ¥{x["price"]:,}\n'
                  f'- 링크: {x["url"]}\n\n'
              )
              if current and current_len + len(block) > MAX_BODY:
                  chunks.append(current)
                  current=[]
                  current_len=len(prefix)
              current.append(block)
              current_len += len(block)

          if current:
              chunks.append(current)

          total=len(chunks)
          for i,chunk in enumerate(chunks,1):
              body=prefix+"".join(chunk)
              suffix=f" ({i}/{total})" if total > 1 else ""
              title=f"Digimart 신규 매물 {len(chunk)}건{suffix}"
              subprocess.run(
                  ["gh","issue","create","--title",title,"--body",body],
                  check=True
              )
          PY
      - name: Save baseline
        if: ${{ !cancelled() && (success() || steps.scan.outcome == 'failure') }}
        run: |
          git config user.name "digimart-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Digimart monitor state"
            git fetch origin main
            git rebase origin/main
            git push
          else
            echo "No monitor state changes to save."
          fi
