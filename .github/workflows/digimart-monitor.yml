name: Digimart Free Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.55.0
          playwright install --with-deps chromium
      - name: Check Digimart
        run: python monitor.py
      - name: Create issue for new listings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          d=json.load(open("data/latest.json",encoding="utf-8"))
          if d.get("baseline") or not d.get("new"):
              print("No new qualifying products.")
              raise SystemExit
          lines=["새 Digimart 매물이 발견되었습니다.",""]
          for x in d["new"]:
              lines += [f'### [{x["keyword"]}] {x["title"]}',f'- 가격: ¥{x["price"]:,}',f'- 링크: {x["url"]}',""]
          subprocess.run(["gh","issue","create","--title",f'Digimart 신규 매물 {len(d["new"])}건',"--body","\n".join(lines)],check=True)
          PY
      - name: Save baseline
        run: |
          git config user.name "digimart-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json data/latest.json
          git diff --cached --quiet || git commit -m "Update Digimart monitor state"
          git push
